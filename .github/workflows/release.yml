name: C/C++ compile & release CI

on:
  push:
    tags:
    - "v*.*.*"
  pull_request:
    tags:
    - "v*.*.*"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install nRF util
      run: |
        mkdir -p .tool
        curl 'https://files.nordicsemi.com/ui/api/v1/download?repoKey=swtools&path=external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil&isNativeBrowsing=false' --output .tool/nrfutil
        chmod +x .tool/nrfutil
        .tool/nrfutil install nrf5sdk-tools --force
    - name: Install Toolchain
      run: |
        mkdir .toolchain
        curl -L --fail -o arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
        printf '%s  %s\n' '8f6903f8ceb084d9227b9ef991490413014d991874a1e34074443c2a72b14dbd' 'arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz' | sha256sum -c -
        tar xf arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz -C .toolchain
        rm -rf arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz 
    - name: Install SDKs
      run: |
        mkdir .sdk
        curl -L --fail -o nrf5_sdk_17.1.0_ddde560.zip https://nsscprodmedia.blob.core.windows.net/prod/software-and-other-downloads/sdks/nrf5/binaries/nrf5_sdk_17.1.0_ddde560.zip
        printf '%s  %s\n' '5bfe38e744c39fd7f30e10077ba12df306ef91f368894795d6a3e7a62dc68061' 'nrf5_sdk_17.1.0_ddde560.zip' | sha256sum -c -
        unzip nrf5_sdk_17.1.0_ddde560.zip -d .sdk
        rm -rf nrf5_sdk_17.1.0_ddde560.zip
        rm -rf .sdk/nRF5_SDK_17.1.0_ddde560/components/toolchain/gcc/Makefile.posix
        printf "GNU_INSTALL_ROOT ?= $(pwd)/.toolchain/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin/\nGNU_VERSION ?= 14.3.1\nGNU_PREFIX ?= arm-none-eabi\n" > .sdk/nRF5_SDK_17.1.0_ddde560/components/toolchain/gcc/Makefile.posix
    - name: Compiling & generating assets
      run: |
        mkdir -p dist
        make dist PLATFORM=BOARD_PCA10059 NRFUTIL=.tool/nrfutil SDK_ROOT=$(pwd)/.sdk/nRF5_SDK_17.1.0_ddde560
        make dist PLATFORM=BOARD_MDK_DONGLE NRFUTIL=.tool/nrfutil SDK_ROOT=$(pwd)/.sdk/nRF5_SDK_17.1.0_ddde560
        make dist PLATFORM=BOARD_CLUE NRFUTIL=.tool/nrfutil SDK_ROOT=$(pwd)/.sdk/nRF5_SDK_17.1.0_ddde560
    - name: Pushing release
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag'
      with:
        body_path: CHANGELOG.txt
        draft: true
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          dist/butterfly-mdk.hex
          dist/butterfly-mdk-fwupgrade.uf2
          dist/butterfly-clue.hex
          dist/butterfly-clue-fwupgrade.uf2
          dist/butterfly.hex
          dist/butterfly-fwupgrade.zip
          
